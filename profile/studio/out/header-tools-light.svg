<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72" role="img" aria-label="Developer tools: Small sharp tools for the daily loop"><defs><style>@media (prefers-reduced-motion:no-preference){.pl{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}}text{font-kerning:normal}</style></defs><defs><clipPath id="sh"><rect width="1200" height="72" rx="22"/></clipPath><linearGradient id="sl" x1="0" x2="1"><stop offset="0" stop-color="#FFD21F"/><stop offset="1" stop-color="#FFD21F" stop-opacity="0"/></linearGradient></defs><g clip-path="url(#sh)"><rect width="1200" height="72" fill="#FFFFFF"/><rect y="69" width="1200" height="3" fill="url(#sl)"/><text x="32" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" font-size="11" letter-spacing="2" fill="#FFD21F">02 / DEVELOPER TOOLS</text><text x="32" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="26" letter-spacing="-.6" fill="#14140F">Small sharp tools for the daily loop</text><text x="1134" y="42" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="600" font-size="12" letter-spacing="1.4" fill="#6B6B62">4 REPOS</text><circle cx="1160" cy="36" r="7" fill="#FFD21F"/><circle class="pl" cx="1160" cy="36" r="7" fill="#FFD21F"/></g><rect x=".5" y=".5" width="1199" height="71" rx="22" fill="none" stroke="#000" stroke-opacity="0.12"/></svg>