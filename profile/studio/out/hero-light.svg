ers="sRGB"><feGaussianBlur in="SourceAlpha" result="sb" stdDeviation="1.4"/><feOffset dy="1.4" in="sb" result="so"/><feComponentTransfer in="so" result="sh"><feFuncA slope=".55" type="linear"/></feComponentTransfer><feMerge><feMergeNode in="sh"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g filter="url(#hp2a)"><rect width="52" height="52" x="6" y="6" fill="url(#hp2b)" rx="18"/><rect width="52" height="52" x="6" y="6" stroke="url(#hp2c)" stroke-width="2.5" rx="18"/><rect width="53.5" height="53.5" x="5.25" y="5.25" stroke="url(#hp2d)" stroke-width=".85" rx="18.75"/><rect width="50.5" height="50.5" x="6.75" y="6.75" stroke="url(#hp2e)" stroke-width=".85" rx="17.25"/><rect width="33" height="33" x="15.5" y="15.5" stroke="url(#hp2f)" stroke-width="2.5" rx="11.423"/><rect width="34.5" height="34.5" x="14.75" y="14.75" stroke="url(#hp2d)" stroke-width=".85" rx="12.173"/><rect width="31.5" height="31.5" x="16.25" y="16.25" stroke="url(#hp2e)" stroke-width=".85" rx="10.673"/><rect width="14" height="14" x="25" y="25" stroke="url(#hp2g)" stroke-width="2.5" rx="4.846"/><rect width="15.5" height="15.5" x="24.25" y="24.25" stroke="url(#hp2d)" stroke-width=".85" rx="5.596"/><rect width="12.5" height="12.5" x="25.75" y="25.75" stroke="url(#hp2e)" stroke-width=".85" rx="4.096"/><rect width="8" height="8" x="28" y="28" fill="url(#hp2h)" rx="2.64"/></g></svg><rect x="998.5" y="72.5" width="45" height="45" rx="12" fill="#FFFFFF" stroke="#000" stroke-opacity="0.16"/><svg x="1007.66" y="81.66" width="26.68" height="26.68" viewBox="0 0 24 24" role="img" aria-label="Stacklit"><rect x="8" y="3" width="13" height="5" rx="1.5" fill="#0a6b5b"/><rect x="3" y="9.5" width="18" height="5" rx="1.5" fill="#1b1a17"/><rect x="3" y="16" width="13" height="5" rx="1.5" fill="#1b1a17"/></svg><rect x="1056.5" y="72.5" width="45" height="45" rx="12" fill="#FFFFFF" stroke="#000" stroke-opacity="0.16"/><svg x="1065.66" y="81.66" width="26.68" height="26.68" viewBox="0 0 512 512" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Outer rounded square gradient: warm top, deep orange bottom -->
    <linearGradient id="hp4bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FF7A30"/>
      <stop offset="100%" stop-color="#C73F00"/>
    </linearGradient>

    <!-- Glass highlight at top: white arc shimmer -->
    <radialGradient id="hp4gloss" cx="50%" cy="0%" r="70%" fx="50%" fy="0%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Center dot radial — inner glow -->
    <radialGradient id="hp4dotGrad" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#FFE0CC"/>
    </radialGradient>

    <!-- Outer ring soft glow -->
    <radialGradient id="hp4ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="80%"  stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Drop shadow filter -->
    <filter id="hp4shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#7a2800" flood-opacity="0.45"/>
    </filter>

    <!-- Subtle inner emboss -->
    <filter id="hp4innerShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feComposite in="SourceGraphic" in2="SourceGraphic" operator="arithmetic" k1="0" k2="1" k3="0" k4="0"/>
    </filter>

    <!-- Ring blur for depth -->
    <filter id="hp4ringBlur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>

    <!-- Center dot glow -->
    <filter id="hp4dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Drop shadow layer -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="#C73F00" filter="url(#hp4shadow)" opacity="0.55"/>

  <!-- Main background square -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#hp4bgGrad)"/>

  <!-- Subtle inner border highlight (top edge) -->
  <rect x="33" y="33" width="446" height="446" rx="99" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.18"/>

  <!-- Glass gloss overlay (top reflection) -->
  <rect x="32" y="32" width="448" height="224" rx="100" fill="url(#hp4gloss)"/>
  <!-- Clip the gloss to the square shape -->
  <clipPath id="hp4squareClip">
    <rect x="32" y="32" width="448" height="448" rx="100"/>
  </clipPath>
  <rect x="32" y="32" width="448" height="230" rx="100" fill="url(#hp4gloss)" clip-path="url(#hp4squareClip)"/>

  <!-- ─── BEACON RINGS ─── -->
  <!-- Outer ring 1 — most faint, outermost -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="white" stroke-width="2.5" opacity="0.13"/>

  <!-- Outer ring 2 -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="white" stroke-width="3" opacity="0.2"/>

  <!-- Middle ring -->
  <circle cx="256" cy="256" r="108" fill="none" stroke="white" stroke-width="4" opacity="0.32"/>

  <!-- Inner ring — clearly visible -->
  <circle cx="256" cy="256" r="74" fill="none" stroke="white" stroke-width="5" opacity="0.55"/>

  <!-- Inner ring subtle fill for depth -->
  <circle cx="256" cy="256" r="74" fill="white" opacity="0.035"/>

  <!-- Center dot glow halo (blurred, behind the dot) -->
  <circle cx="256" cy="256" r="36" fill="white" opacity="0.18" filter="url(#hp4dotGlow)"/>

  <!-- Center dot — main white filled circle with depth gradient -->
  <circle cx="256" cy="256" r="30" fill="url(#hp4dotGrad)" filter="url(#hp4dotGlow)"/>

  <!-- Center dot top-left highlight for 3D feel -->
  <ellipse cx="248" cy="247" rx="12" ry="9" fill="white" opacity="0.45"/>

  <!-- ─── BOTTOM: Teardrop "drop tail" below center ─── -->
