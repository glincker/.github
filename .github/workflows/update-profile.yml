name: Update organization profile

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild the profile images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node profile/studio/generate.mjs

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain profile)" ]; then
            git config user.name "profile-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add profile
            git commit -m "chore: refresh organization profile"
            git push
          else
            echo "No changes."
          fi
